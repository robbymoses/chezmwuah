# Eldritch Spaceship theme - using palette-driven colors


palette = 'eldritch_cthulhu'
# Palette definitions
[palettes.eldritch_cthulhu]
background  = "#212337" # Sunken Depths Grey
currentline = "#323449" # Shallow Depths Grey
surface     = "#454759" # Tidal Surface
overlay     = "#5b5c66" # Murk Overlay
foreground  = "#ebfafa" # Lighthouse White
comment     = "#7081d0" # The Old One Purple
cyan        = "#04d1f9" # Watery Tomb Blue
green       = "#37f499" # Great Old One Green
orange      = "#f7c67f" # Dreaming Orange
pink        = "#f265b5" # Pustule Pink
purple      = "#a48cf2" # Lovecraft Purple
red         = "#f16c75" # R'lyeh' Red
yellow      = "#f1fc79" # Gold of Yuggoth

format = """
$directory\
$username\
$hostname\
$git_branch\
$git_state\
$git_status\
$git_commit\
$aws\
$nodejs\
$python\
$rust\
$golang\
$docker_context\
$package\
$line_break\
$character"""

# Right side of the prompt
right_format = "$cmd_duration $time"

add_newline = true

[character]
success_symbol = "[->](bold green)"
error_symbol = "[->](bold red)"
vicmd_symbol = "[❮](bold yellow)"

[directory]
style = "cyan bold"
format = "[ ]($style)[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"
read_only = " "
read_only_style = "red"

[username]
style_user = "green bold"
style_root = "red bold"
format = '[\[$user\]]($style)' #Remove '\[' or '\]' if you do not want brackets
show_always = true

[hostname]
format = "[@$hostname:](green bold)"
ssh_only = false

[git_branch]
symbol = " "
style = "purple bold"
format = '[$symbol$branch·]($style)'

[git_status]
style = "purple bold"
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'

[git_commit]
style = "purple bold"
commit_hash_length = 4
tag_symbol = '🔖 '

[git_state]
style = "purple bold"
format = '\([$state( $progress_current of $progress_total)]($style)\) '

[nodejs]
symbol = "⬢ "
style = "green"
format = "[$symbol($version)]($style) "

[lua]
format = 'via [🌕 $version](bold blue) '

[python]
symbol = " "
style = "cyan"
format = "[$symbol($version)]($style) "

[rust]
symbol = "🦀 "
style = "red"
format = "[$symbol($version)]($style) "

[golang]
symbol = " "
style = "cyan"
format = "[$symbol($version)]($style) "

[docker_context]
symbol = "🐳 "
style = "cyan bold"
format = "[$symbol$context]($style) "

[terraform]
format = '[🏎💨 $workspace]($style) '

[aws]
format = "on [$symbol($profile)(($region))]($style) "
symbol = "  "
style = "bold yellow"
disabled = true
[aws.region_aliases]
ap-southeast-2 = 'au'
us-east-1 = 'va'

[azure]
disabled = false
format = "on [$symbol($username)]($style) "
symbol = "󰠅 "
style = "cyan bold"

[package]
symbol = "📦 "
style = "orange bold"
format = "[$symbol$version]($style) "

[cmd_duration]
min_time = 200
format = '[\(⏱ $duration\)]($style) '
style = "orange bold"

[time]
disabled = false
time_format = "%T"
format = "[$time]($style) "
style = "bold purple"
