# A complete powerline-style theme, ported from the Catppuccin/Pastel powerline presets
# Requires a Nerd Font for the segment separators and module icons to render correctly

"$schema" = 'https://starship.rs/config-schema.json'

# Sets user-defined palette
palette = 'eldritch_cthulhu'

format = """
[](primary)\
$os\
$username\
[](bg:secondary fg:primary)\
$directory\
[](bg:tertiary fg:secondary)\
$git_branch\
$git_status\
[](fg:tertiary bg:quaternary)\
$c\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:quaternary bg:quinary)\
$conda\
[](fg:quinary bg:senary)\
$time\
[ ](fg:senary)\
$cmd_duration\
$line_break\
$character"""

[os]
disabled = false
style = "bg:primary fg:base"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:primary fg:base"
style_root = "bg:primary fg:base"
format = '[ $user]($style)'

[directory]
style = "bg:secondary fg:base"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:tertiary"
format = '[[ $symbol $branch ](fg:base bg:tertiary)]($style)'

[git_status]
style = "bg:tertiary"
format = '[[($all_status$ahead_behind )](fg:base bg:tertiary)]($style)'

[nodejs]
symbol = ""
style = "bg:quaternary"
format = '[[ $symbol( $version) ](fg:base bg:quaternary)]($style)'

[bun]
symbol = ""
style = "bg:quaternary"
format = '[[ $symbol( $version) ](fg:base bg:quaternary)]($style)'

[c]
symbol = " "
style = "bg:quaternary"
format = '[[ $symbol( $version) ](fg:base bg:quaternary)]($style)'

[rust]
symbol = ""
style = "bg:quaternary"
format = '[[ $symbol( $version) ](fg:base bg:quaternary)]($style)'

[golang]
symbol = ""
style = "bg:quaternary"
format = '[[ $symbol( $version) ](fg:base bg:quaternary)]($style)'

[php]
symbol = ""
style = "bg:quaternary"
format = '[[ $symbol( $version) ](fg:base bg:quaternary)]($style)'

[java]
symbol = " "
style = "bg:quaternary"
format = '[[ $symbol( $version) ](fg:base bg:quaternary)]($style)'

[kotlin]
symbol = ""
style = "bg:quaternary"
format = '[[ $symbol( $version) ](fg:base bg:quaternary)]($style)'

[haskell]
symbol = ""
style = "bg:quaternary"
format = '[[ $symbol( $version) ](fg:base bg:quaternary)]($style)'

[python]
symbol = ""
style = "bg:quaternary"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:base bg:quaternary)]($style)'

[docker_context]
symbol = ""
style = "bg:quinary"
format = '[[ $symbol( $context) ](fg:base bg:quinary)]($style)'

[conda]
symbol = "  "
style = "fg:base bg:quinary"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:senary"
format = '[[  $time ](fg:base bg:senary)]($style)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:primary)'
error_symbol = '[❯](bold fg:quaternary)'
vimcmd_symbol = '[❮](bold fg:secondary)'
vimcmd_replace_one_symbol = '[❮](bold fg:quaternary)'
vimcmd_replace_symbol = '[❮](bold fg:quaternary)'
vimcmd_visual_symbol = '[❮](bold fg:senary)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bg:senary"
disabled = false
show_notifications = true
min_time_to_notify = 45000

# Palette definitions
[palettes.eldritch_cthulhu]
primary = "#37f499"    # green
secondary = "#04d1f9"  # cyan
tertiary = "#a48cf2"   # purple
quaternary = "#f16c75" # red
quinary = "#f7c67f"    # orange
senary = "#f1fc79"     # yellow
base = "#212337"       # background

[palettes.eldritch_abyss]
primary = "#2dcc82"    # green
secondary = "#0396b3"  # cyan
tertiary = "#8b75d9"   # purple
quaternary = "#cc5860" # red
quinary = "#d4a666"    # orange
senary = "#ccd663"     # yellow
base = "#171928"       # background

[palettes.eldritch_dusk]
primary = "#38ff9f"    # green
secondary = "#0ad6ff"  # cyan
tertiary = "#8a69f7"   # purple
quaternary = "#fb5b66" # red
quinary = "#ffaf4d"    # orange
senary = "#fff952"     # yellow
base = "#1e2029"       # foreground